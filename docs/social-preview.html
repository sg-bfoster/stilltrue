<!doctype html>
<!--
  Source for docs/social-preview.png — the repo's GitHub social preview
  (Settings -> General -> Social preview).

  Regenerate after editing, from the repo root:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=2 \
      --window-size=1280,640 --screenshot=docs/social-preview.png \
      "file://$PWD/docs/social-preview.html"

  GitHub wants 1280x640; the 2x scale factor renders 2560x1280 so it stays
  sharp on retina. Keep the file under 1 MB.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; }
  body {
    background: #0b1220;
    background-image:
      radial-gradient(900px 520px at 12% 8%, rgba(63,185,80,0.13), transparent 62%),
      radial-gradient(700px 460px at 95% 100%, rgba(56,139,253,0.10), transparent 60%);
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    color: #e6edf3;
    display: flex;
    align-items: center;
    padding: 0 84px;
    overflow: hidden;
  }
  .row { display: flex; align-items: center; gap: 72px; width: 100%; }
  .left { flex: 1 1 auto; min-width: 0; }

  .mark {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 96px;
    font-weight: 600;
    letter-spacing: -3px;
    line-height: 1;
    color: #ffffff;
  }
  .mark .dim { color: #3fb950; }

  .tag {
    margin-top: 30px;
    font-size: 35px;
    line-height: 1.34;
    font-weight: 400;
    color: #c2ccd6;
    max-width: 640px;
  }
  .tag b { color: #ffffff; font-weight: 600; }

  .meta {
    margin-top: 44px;
    display: flex;
    align-items: center;
    gap: 18px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 21px;
    color: #7d8896;
  }
  .cmd {
    color: #c9d4e0;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 9px 16px;
  }
  .cmd .p { color: #3fb950; }

  /* right: the report grid — mostly green, one stale */
  .grid {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(5, 46px);
    grid-auto-rows: 46px;
    gap: 13px;
  }
  .c { border-radius: 9px; background: rgba(63,185,80,0.20); border: 1px solid rgba(63,185,80,0.42); }
  .c.rot {
    background: rgba(248,81,73,0.26);
    border-color: rgba(248,81,73,0.72);
    box-shadow: 0 0 0 6px rgba(248,81,73,0.10), 0 0 26px rgba(248,81,73,0.35);
  }
  .c.faint { background: rgba(63,185,80,0.10); border-color: rgba(63,185,80,0.22); }
</style>
</head>
<body>
  <div class="row">
    <div class="left">
      <div class="mark">stilltrue<span class="dim">.</span></div>
      <div class="tag">Your tests check your code.<br><b>This checks your facts.</b></div>
      <div class="meta">
        <span class="cmd"><span class="p">$</span> npx stilltrue drift</span>
        <span>MIT</span>
      </div>
    </div>
    <div class="grid">
      <div class="c"></div><div class="c"></div><div class="c faint"></div><div class="c"></div><div class="c"></div>
      <div class="c faint"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c faint"></div>
      <div class="c"></div><div class="c"></div><div class="c rot"></div><div class="c faint"></div><div class="c"></div>
      <div class="c"></div><div class="c faint"></div><div class="c"></div><div class="c"></div><div class="c"></div>
    </div>
  </div>
</body>
</html>
